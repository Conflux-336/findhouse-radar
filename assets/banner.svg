<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">找房雷达 · Findhouse Radar</title>
  <desc id="desc">本地优先的租房尽调工作台：手动录入、中介过滤、同址对比、首月成本，数据只存本机。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#fbf5e3"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effcf8"/>
      <stop offset="1" stop-color="#d7f6ef"/>
    </linearGradient>
    <radialGradient id="heatA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#19c8b9" stop-opacity=".72"/>
      <stop offset="1" stop-color="#19c8b9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5c542" stop-opacity=".78"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f08c63" stop-opacity=".62"/>
      <stop offset="1" stop-color="#f08c63" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#d9c9ab" opacity=".42"/>
    </pattern>
    <clipPath id="mapClip">
      <rect x="0" y="0" width="330" height="216" rx="22"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="32" fill="url(#bg)" stroke="#e8dcc4" stroke-width="3"/>
  <circle cx="1128" cy="18" r="150" fill="#e6f9f6" opacity=".55"/>
  <circle cx="1180" cy="300" r="92" fill="#f9efc9" opacity=".5"/>
  <rect x="2" y="2" width="1196" height="316" rx="32" fill="url(#dots)"/>

  <!-- logo -->
  <g transform="translate(64,86)">
    <rect width="132" height="132" rx="34" fill="url(#logo)" stroke="#8edbd0" stroke-width="4"/>
    <circle cx="66" cy="66" r="50" fill="none" stroke="#19c8b9" stroke-width="3" opacity=".28"/>
    <circle cx="66" cy="66" r="35" fill="none" stroke="#19c8b9" stroke-width="3" opacity=".45"/>
    <circle cx="66" cy="66" r="21" fill="none" stroke="#19c8b9" stroke-width="3" opacity=".62"/>
    <path d="M66 29c-17.1 0-31 13.9-31 31 0 22.4 31 47 31 47s31-24.6 31-47c0-17.1-13.9-31-31-31z" fill="#19c8b9" stroke="#0f8f84" stroke-width="3"/>
    <path d="M53 63l13-13 13 13v16a2 2 0 0 1-2 2H55a2 2 0 0 1-2-2V63z" fill="#fffdf5"/>
    <rect x="62" y="68" width="8" height="13" rx="1.5" fill="#8edbd0"/>
  </g>

  <!-- title -->
  <text x="226" y="126" fill="#5f4326" font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="800" letter-spacing="1">找房雷达</text>
  <text x="228" y="166" fill="#8b7f6b" font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700">Findhouse Radar · 本地优先的租房尽调工作台</text>

  <!-- feature pills -->
  <g font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="800">
    <rect x="228" y="188" width="104" height="34" rx="17" fill="#e6f9f6" stroke="#8edbd0" stroke-width="2"/>
    <text x="280" y="210" text-anchor="middle" fill="#0f8e84">手动录入</text>
    <rect x="342" y="188" width="104" height="34" rx="17" fill="#fdf7d3" stroke="#f0e39a" stroke-width="2"/>
    <text x="394" y="210" text-anchor="middle" fill="#8a6a00">中介过滤</text>
    <rect x="456" y="188" width="104" height="34" rx="17" fill="#fde8e4" stroke="#f4c0b9" stroke-width="2"/>
    <text x="508" y="210" text-anchor="middle" fill="#b3423c">同址对比</text>
    <rect x="570" y="188" width="104" height="34" rx="17" fill="#eef8d9" stroke="#c9e6a4" stroke-width="2"/>
    <text x="622" y="210" text-anchor="middle" fill="#3f7d16">首月成本</text>
  </g>

  <text x="228" y="271" fill="#a89b85" font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700">数据只存本机 · 无后端 · 可导出 JSON 备份</text>
  <circle cx="208" cy="266" r="5" fill="#7fd8c9"/>

  <!-- map card -->
  <g transform="translate(812,52)">
    <rect x="0" y="0" width="330" height="216" rx="24" fill="#f7f3df" stroke="#e2d3b8" stroke-width="3"/>
    <g clip-path="url(#mapClip)">
      <rect width="330" height="216" fill="#f4efdc"/>
      <path d="M-20 176C62 154 106 112 196 104S304 62 356 34" fill="none" stroke="#eadfc8" stroke-width="11" stroke-linecap="round"/>
      <path d="M46 -10C62 54 96 112 154 226" fill="none" stroke="#eadfc8" stroke-width="9" stroke-linecap="round"/>
      <path d="M-12 76C62 96 82 44 152 64S262 112 348 88" fill="none" stroke="#cfeee8" stroke-width="13" stroke-linecap="round"/>
      <path d="M214 226C232 174 270 154 340 150" fill="none" stroke="#eadfc8" stroke-width="7" stroke-linecap="round"/>
      <circle cx="94" cy="138" r="64" fill="url(#heatA)"/>
      <circle cx="158" cy="92" r="58" fill="url(#heatB)"/>
      <circle cx="232" cy="142" r="52" fill="url(#heatC)"/>
      <circle cx="278" cy="84" r="42" fill="url(#heatA)" opacity=".55"/>
      <g stroke="#fffdf5" stroke-width="2">
        <circle cx="94" cy="138" r="7" fill="#0f8f84"/>
        <circle cx="158" cy="92" r="6" fill="#b58a00"/>
        <circle cx="232" cy="142" r="6" fill="#b3423c"/>
        <circle cx="278" cy="84" r="5" fill="#0f8f84"/>
      </g>
    </g>
    <rect x="14" y="13" width="116" height="28" rx="14" fill="#fffdf5" stroke="#e2d3b8" stroke-width="2"/>
    <circle cx="29" cy="27" r="5" fill="#f08c63"/>
    <text x="41" y="32" fill="#6b4a26" font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800">房源热力（本机）</text>
    <rect x="244" y="13" width="72" height="28" rx="14" fill="#e6f9f6" stroke="#8edbd0" stroke-width="2"/>
    <text x="280" y="32" text-anchor="middle" fill="#0f8e84" font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="800">12 条</text>
    <rect x="14" y="166" width="160" height="34" rx="12" fill="#fffdf5" stroke="#e2d3b8" stroke-width="2"/>
    <text x="28" y="188" fill="#8b7f6b" font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">中位租金</text>
    <text x="158" y="190" text-anchor="end" fill="#0f8e84" font-family="'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800">¥4,350</text>
  </g>

  <!-- corner sparkles -->
  <g fill="#19c8b9" opacity=".7">
    <path d="M762 54l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M738 224l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".6"/>
  </g>
</svg>
